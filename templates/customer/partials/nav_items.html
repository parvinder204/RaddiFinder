{% with current=request.resolver_match.url_name %}
<li class="nav-item">
    <a class="nav-link{% if current == 'dashboard' or current == 'select-items' %} is-current{% endif %}" href="{% url 'customer:dashboard' %}"{% if current == 'dashboard' or current == 'select-items' %} aria-current="page"{% endif %}><i class="fa fa-home" aria-hidden="true"></i><span>Home</span></a>
</li>
{% if request.user.is_authenticated %}
<li class="nav-item">
    <a class="nav-link{% if current == 'history' or current == 'view-order' %} is-current{% endif %}" href="{% url 'customer:history' %}"{% if current == 'history' or current == 'view-order' %} aria-current="page"{% endif %}><i class="fa fa-history" aria-hidden="true"></i><span>History</span></a>
</li>
<li class="nav-item">
    <a class="nav-link{% if current == 'account-settings' %} is-current{% endif %}" href="{% url 'customer:account-settings' %}"{% if current == 'account-settings' %} aria-current="page"{% endif %}><i class="fa fa-cog" aria-hidden="true"></i><span>Settings</span></a>
</li>
<li class="nav-item">
    <a class="nav-link{% if current == 'notifications' %} is-current{% endif %}" href="{% url 'customer:notifications' %}"{% if current == 'notifications' %} aria-current="page"{% endif %}><i class="fa fa-bell" aria-hidden="true"></i><span>Notification</span></a>
</li>
{% endif %}
{% endwith %}
