<form method="get" class="js-list-controls list-toolbar" role="search">
    <div class="dataTables_length list-toolbar__length">
        <label>
            <span class="list-toolbar__text">Show</span>
            <select name="per_page" class="form-select form-select-sm" aria-label="Entries per page" data-auto-submit>
                {% for size in page_sizes %}
                <option value="{{ size }}"{% if size == page_size %} selected{% endif %}>{{ size }}</option>
                {% endfor %}
            </select>
            <span class="list-toolbar__text list-toolbar__text--suffix">entries</span>
        </label>
    </div>
    <div class="dataTables_filter list-toolbar__search">
        <label>
            <span class="list-toolbar__text list-toolbar__text--search">Search:</span>
            <input type="search" name="q" value="{{ search }}" class="form-control form-control-sm" placeholder="Search..." aria-label="Search" maxlength="100" autocomplete="off" data-debounce-submit>
        </label>
    </div>
</form>
