<form method="get" class="row js-list-controls" role="search">
    <div class="col-sm-12 col-md-6">
        <div class="dataTables_length">
            <label>Show
                <select name="per_page" class="form-select form-select-sm" data-auto-submit>
                    {% for size in page_sizes %}
                    <option value="{{ size }}"{% if size == page_size %} selected{% endif %}>{{ size }}</option>
                    {% endfor %}
                </select> entries
            </label>
        </div>
    </div>
    <div class="col-sm-12 col-md-6">
        <div class="dataTables_filter">
            <label>Search:
                <input type="search" name="q" value="{{ search }}" class="form-control form-control-sm" maxlength="100" autocomplete="off" data-debounce-submit>
            </label>
        </div>
    </div>
</form>
